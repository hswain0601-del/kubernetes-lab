apiVersion: v1
kind: Pod
metadata:
  name: myvolconfig
spec:
  containers:
  - name: c1
    image: ubuntu
    command:
      - /bin/bash
      - -c
      - |
        while true; do
          echo "===== CONFIG FILE ====="
          cat /tmp/config/sample.conf
          sleep 5
        done
    volumeMounts:
    - name: testconfigmap
      mountPath: /tmp/config
  volumes:
  - name: testconfigmap
    configMap:
      name: mymap
