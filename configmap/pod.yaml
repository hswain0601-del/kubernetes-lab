apiVersion: v1
kind: Pod
metadata:
  name: myvolconfig
spec:
  containers:
  - name: c1
    image: ubuntu
    command:
      - /bin/bash
      - -c
      - |
        while true; do
          echo "CONFIG FILE"
          cat /tmp/config/sample.conf
          sleep 5
        done
    volumeMounts:                          # Mount the volume testconfigmap inside the container at - /tmp/config
    - name: testconfigmap
      mountPath: /tmp/config
  volumes:                                 # Create a volume named testconfigmap and the volume’s source is a ConfigMap "mymap"
  - name: testconfigmap                    # NOTE - Use ConfigMaps for configuration and PVCs for data - means, a ConfigMap can be mounted as a volume, but it is not persistent storage, it is meant only for configuration data, data is managed by Kubernetes and deleted when pod is deleted 
    configMap:
      name: mymap
