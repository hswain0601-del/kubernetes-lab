apiVersion: apps/v1
kind: Deployment
metadata:
  name: pvdeploy
spec:
  selector:
    matchLabels:
      app: mypv
  template:
    metadata:
      labels:
        app: mypv
    spec:
      containers:
      - name: shell
        image: ubuntu:latest
        command: ["bin/bash", "-c", "sleep 10000"]
        volumeMounts:
        - name: mypd
          mountPath: "/tmp/persistent"      # Mounts a volume inside the ubuntu container - /tmp/persistent
      volumes:
      - name: mypd
        persistentVolumeClaim:
          claimName: myhostpathvolclaim     #  Defines the volume source and uses PVC: myhostpathvolclaim, PVC is already bound to a PV
