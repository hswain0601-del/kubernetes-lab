apiVersion: v1
kind: Pod
metadata:
  name: myvolsecret
spec:
  containers:
  - name: c1
    image: ubuntu
    command:
      - /bin/bash
      - -c
      - |
        while true; do
          echo "===== SECRET FILE ====="
          cat /tmp/secret/sample.conf
          sleep 5
        done
    volumeMounts:
    - name: secret-volume
      mountPath: /tmp/secret
      readOnly: true
  volumes:
  - name: secret-volume
    secret:
      secretName: mysecret