apiVersion: v1
kind: Pod
metadata:
  name: myvolsecret
spec:
  containers:
  - name: c1
    image: ubuntu
    command:
      - /bin/bash
      - -c
      - |
        while true; do
          echo "===== SECRET FILE ====="
          cat /tmp/secret/sample.conf
          sleep 5
        done
    volumeMounts:                         # Mount the volume secret-volume inside the container at - /tmp/secret
    - name: secret-volume
      mountPath: /tmp/secret
      readOnly: true
  volumes:                                # Create a volume named secret-volume and the volume’s source is a secret "mysecret"
  - name: secret-volume
    secret:
      secretName: mysecret                
