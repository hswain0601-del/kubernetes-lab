apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo.fullname" . }}-basic-auth
type: Opaque
data:
  .htpasswd: {{ printf "%s:{PLAIN}%s" (.Values.auth.username | b64dec) (.Values.auth.password | b64dec) | b64enc | quote }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo.fullname" . }}-secret
type: Opaque
data:
  MYSQL_USER: {{ .Values.db.user | quote }}
  MYSQL_PASSWORD: {{ .Values.db.password | quote }}
  MYSQL_DATABASE: {{ .Values.db.name | b64enc | quote }}
