apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "todo.fullname" . }}-pv
spec:
  capacity:
    storage: {{ .Values.mysql.storage }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hostpath  # <--- This must be added to match the PVC
  hostPath:
    path: /mnt/data/{{ include "todo.fullname" . }}