apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "todo.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "todo.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "todo.name" . }}
    spec:
      containers:

      # 🔵 NGINX
      - name: nginx
        image: {{ .Values.nginx.image }}
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: auth
          mountPath: /etc/nginx/.htpasswd
          subPath: .htpasswd

      # 🟢 TODO APP
      - name: todo-app
        image: {{ .Values.todoApp.image }}
        ports:
        - containerPort: {{ .Values.todoApp.port }}
        command: ["sh","-c","yarn install && yarn run dev --host 0.0.0.0"]
        env:
        - name: MYSQL_HOST
          value: {{ include "todo.fullname" . }}-mysql
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "todo.fullname" . }}-secret
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "todo.fullname" . }}-secret
              key: MYSQL_PASSWORD
        - name: MYSQL_DB
          valueFrom:
            secretKeyRef:
              name: {{ include "todo.fullname" . }}-secret
              key: MYSQL_DATABASE

      volumes:
      - name: nginx-config
        configMap:
          name: {{ include "todo.fullname" . }}-nginx-config
      - name: auth
        secret:
          secretName: {{ include "todo.fullname" . }}-basic-auth