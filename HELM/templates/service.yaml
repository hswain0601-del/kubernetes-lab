apiVersion: v1
kind: Service
metadata:
  name: {{ include "todo.fullname" . }}
spec:
  type: NodePort
  selector:
    app: {{ include "todo.name" . }}
  ports:
  - port: 80
    targetPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "todo.fullname" . }}-mysql
spec:
  selector:
    app: mysql
  ports:
  - port: 3306