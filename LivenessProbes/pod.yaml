apiVersion: v1
kind: Pod
metadata:
  labels:
    test: liveness
  name: mylivenessprobe
spec:
  containers:
  - name: liveness
    image: ubuntu
    args:
    - /bin/sh
    - -c
    - touch /tmp/healthy; sleep 1000      # Runs a shell -> Creates a file /tmp/healthy -> Sleeps for 1000s to keep container running
    livenessProbe:                        # If container fails repeatedly → Kubernetes restarts the container                                   
      exec:
        command:                                         
        - cat                
        - /tmp/healthy                    # Kubernetes executes this command inside the container - cat /tmp/healthy If file exists → exit code 0 → healthy and If file missing → exit code ≠ 0 → unhealthy
      initialDelaySeconds: 5              # Wait 5 seconds after container starts then it begin health checks      
      periodSeconds: 5                    # Run the liveness check every 5 seconds
      timeoutSeconds: 30                  # If probe command takes longer than 30s → probe fails and we will see the restart count.
